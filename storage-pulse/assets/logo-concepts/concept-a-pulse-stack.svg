<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101a3d"/>
      <stop offset="1" stop-color="#23135c"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3ee6ff"/>
      <stop offset="0.55" stop-color="#3ee6ff"/>
      <stop offset="0.72" stop-color="#ffb347"/>
      <stop offset="1" stop-color="#ff8a3d" stop-opacity="0.55"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.3" cy="0.25" r="0.9">
      <stop offset="0" stop-color="#4f7cff" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#4f7cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#bg)"/>
  <rect x="4" y="4" width="120" height="120" rx="28" fill="url(#glow)"/>
  <rect x="4.5" y="4.5" width="119" height="119" rx="27.5" fill="none" stroke="#ffffff" stroke-opacity="0.14"/>
  <!-- storage stack: three discs -->
  <g fill="none" stroke="#9fb3ff" stroke-opacity="0.55" stroke-width="3">
    <ellipse cx="64" cy="38" rx="30" ry="9"/>
    <path d="M34 38v18c0 5 13.4 9 30 9s30-4 30-9V38"/>
    <path d="M34 56v18c0 5 13.4 9 30 9s30-4 30-9V56"/>
    <path d="M34 74v16c0 5 13.4 9 30 9s30-4 30-9V74"/>
  </g>
  <!-- pulse line -->
  <path d="M14 70h26l7-16 10 34 9-40 8 30 5-8h35" fill="none" stroke="url(#pulse)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" filter="url(#soft)"/>
</svg>
