<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" width="96" height="96" role="img" aria-label="Platform Lens">
  <defs>
    <linearGradient id="pl-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14857f"/>
      <stop offset="1" stop-color="#1b4fa8"/>
    </linearGradient>
  </defs>
  <rect width="96" height="96" rx="22" fill="url(#pl-bg)"/>
  <!-- lens -->
  <circle cx="42" cy="42" r="22" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-width="7"/>
  <!-- rising bars seen through the lens -->
  <rect x="30.5" y="43" width="6" height="10" rx="1.5" fill="#ffffff"/>
  <rect x="39" y="37" width="6" height="16" rx="1.5" fill="#ffffff"/>
  <rect x="47.5" y="30" width="6" height="23" rx="1.5" fill="#7ff0d6"/>
  <!-- handle -->
  <line x1="59" y1="59" x2="75" y2="75" stroke="#ffffff" stroke-width="9" stroke-linecap="round"/>
</svg>
